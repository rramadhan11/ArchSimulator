  msgsPerSecPerPartition: { default: 20000, source: { kind: default-estimate } }
  publishLatencyMs: { default: 1, description: "Publish with confirms", source: { kind: default-estimate } }
  serviceCs2: { default: 0.5, source: { kind: default-estimate } }
