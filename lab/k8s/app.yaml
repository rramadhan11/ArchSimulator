# Reference service + HPA. Mirrored by ../design.json; change both together.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: work
spec:
  replicas: 1
  selector:
    matchLabels: { app: work }
  template:
    metadata:
      labels: { app: work }
    spec:
      containers:
        - name: work
          image: archsim-lab-work:dev
          imagePullPolicy: Never # loaded into kind by run.sh
          env:
            - { name: WORK_MS, value: "4" }
            # One Go thread runs code at a time: one server per pod, as
            # ArchSim models a 0.25-core pod (Go 1.23 ignores CPU limits).
            - { name: GOMAXPROCS, value: "1" }
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 250m, memory: 32Mi }
            limits: { cpu: 250m, memory: 64Mi }
          # A TCP probe is answered by the kernel. An HTTP probe would wait
          # behind hundreds of requests sharing 0.25 CPU: the first run (see
          # README) failed it under the spike, the pod left the Service and
          # the HPA, which gets no metrics from unready pods, stalled. That is
          # a real failure mode, but this lab measures HPA timing.
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: work
spec:
  type: NodePort
  selector: { app: work }
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
---
# Default scaling behavior (as ArchSim's catalog defaults): 15 s sync,
# tolerance 0.1, scale-up 100% or 4 pods per 15 s, 300 s down-stabilization.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: work
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: work }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
